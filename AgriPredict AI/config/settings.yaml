# AgriPredict AI Configuration Settings
app:
  name: "AgriPredict AI - Agricultural Market & Price Prediction Simulator"
  version: "2.5.0"
  tagline: "Empowering Farmers with Predictive Intelligence & Market Economics"
  author: "DeepMind Agri-Intelligence Team"
  theme: "agri-emerald"

database:
  url: "sqlite:///./agricultural_market.db"
  echo: false

ml:
  target_column: "modal_price"
  horizon_days: [7, 15, 30]
  default_horizon: 15
  test_size_ratio: 0.20
  random_state: 42
  sequence_length: 30 # For LSTM / Sequential Models
  confidence_interval_z: 1.645 # 90% confidence interval
  models_to_train:
    - "xgboost"
    - "lstm"
    - "prophet"
    - "random_forest"

crops:
  Tomato:
    category: "Vegetable (Perishable)"
    shelf_life_days: 7
    cold_storage_shelf_life_days: 30
    spoilage_rate_ambient_pct_day: 4.5
    spoilage_rate_cold_pct_day: 0.8
    cold_storage_cost_per_q_day: 4.0
    ambient_storage_cost_per_q_day: 1.0
    price_elasticity: 0.65
    cultivation_cost_per_acre: 65000
    avg_yield_quintals_per_acre: 110
    seasons: ["Kharif", "Rabi", "Summer"]
  Onion:
    category: "Bulb (Semi-Perishable)"
    shelf_life_days: 30
    cold_storage_shelf_life_days: 120
    spoilage_rate_ambient_pct_day: 1.5
    spoilage_rate_cold_pct_day: 0.3
    cold_storage_cost_per_q_day: 3.5
    ambient_storage_cost_per_q_day: 0.8
    price_elasticity: 0.55
    cultivation_cost_per_acre: 55000
    avg_yield_quintals_per_acre: 90
    seasons: ["Kharif", "Late Kharif", "Rabi"]
  Potato:
    category: "Tuber (Storable)"
    shelf_life_days: 45
    cold_storage_shelf_life_days: 210
    spoilage_rate_ambient_pct_day: 0.9
    spoilage_rate_cold_pct_day: 0.15
    cold_storage_cost_per_q_day: 3.0
    ambient_storage_cost_per_q_day: 0.6
    price_elasticity: 0.45
    cultivation_cost_per_acre: 60000
    avg_yield_quintals_per_acre: 120
    seasons: ["Rabi"]
  Rice:
    category: "Cereal Grain (Durable)"
    shelf_life_days: 365
    cold_storage_shelf_life_days: 730
    spoilage_rate_ambient_pct_day: 0.05
    spoilage_rate_cold_pct_day: 0.01
    cold_storage_cost_per_q_day: 1.8
    ambient_storage_cost_per_q_day: 0.4
    price_elasticity: 0.35
    cultivation_cost_per_acre: 42000
    avg_yield_quintals_per_acre: 45
    seasons: ["Kharif", "Rabi"]
  Maize:
    category: "Cereal Grain (Durable)"
    shelf_life_days: 180
    cold_storage_shelf_life_days: 365
    spoilage_rate_ambient_pct_day: 0.1
    spoilage_rate_cold_pct_day: 0.02
    cold_storage_cost_per_q_day: 1.9
    ambient_storage_cost_per_q_day: 0.45
    price_elasticity: 0.40
    cultivation_cost_per_acre: 38000
    avg_yield_quintals_per_acre: 50
    seasons: ["Kharif", "Rabi"]

